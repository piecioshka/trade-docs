<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Arial, sans-serif" font-size="13">
  <!-- Tło -->
  <rect width="560" height="360" fill="#fafafa" rx="8"/>

  <!-- Tytuł -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Rolowanie CFD: skok ceny i korekta na rachunku</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">LONG 0,1 lota ropy Brent (100 baryłek), contango: czerwiec 72,50 → lipiec 73,10</text>

  <!-- === GÓRNY PANEL: wykres ceny === -->
  <line x1="50" y1="80" x2="50" y2="190" stroke="#bbb" stroke-width="1.5"/>
  <line x1="50" y1="190" x2="540" y2="190" stroke="#bbb" stroke-width="1.5"/>
  <text x="46" y="134" text-anchor="end" font-size="11" fill="#555">72,50</text>
  <text x="46" y="94" text-anchor="end" font-size="11" fill="#555">73,10</text>

  <!-- Dzień rolowania -->
  <line x1="300" y1="70" x2="300" y2="190" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="300" y="66" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">dzień rolowania</text>

  <!-- Stary kontrakt -->
  <line x1="60" y1="130" x2="300" y2="130" stroke="#333" stroke-width="2.5"/>
  <text x="180" y="122" text-anchor="middle" font-size="11" fill="#333">stary kontrakt (czerwiec) 72,50</text>

  <!-- Skok -->
  <line x1="300" y1="130" x2="300" y2="90" stroke="#333" stroke-width="2.5"/>
  <text x="308" y="114" font-size="11" fill="#dc2626" font-weight="bold">+0,60</text>

  <!-- Nowy kontrakt -->
  <line x1="300" y1="90" x2="540" y2="90" stroke="#333" stroke-width="2.5"/>
  <text x="420" y="82" text-anchor="middle" font-size="11" fill="#333">nowy kontrakt (lipiec) 73,10</text>

  <!-- Podpis osi -->
  <text x="60" y="206" font-size="10" fill="#888">czas →</text>
  <text x="180" y="206" text-anchor="middle" font-size="10" fill="#888">to nie ruch rynku, tylko zmiana serii</text>

  <!-- === DOLNY PANEL: rachunek === -->
  <rect x="50" y="222" width="490" height="96" fill="#fff" stroke="#ddd" rx="6"/>
  <text x="70" y="244" font-size="12" font-weight="bold" fill="#333">Co widzisz na rachunku (LONG 100 baryłek):</text>

  <!-- Wiersz 1: wycena -->
  <rect x="70" y="256" width="120" height="16" fill="#16a34a" rx="2"/>
  <text x="200" y="268" font-size="11" fill="#16a34a" font-weight="bold">+60 USD</text>
  <text x="260" y="268" font-size="11" fill="#555">wycena pozycji skacze (100 × 0,60)</text>

  <!-- Wiersz 2: korekta -->
  <rect x="70" y="278" width="120" height="16" fill="#dc2626" rx="2"/>
  <text x="200" y="290" font-size="11" fill="#dc2626" font-weight="bold">-60 USD</text>
  <text x="260" y="290" font-size="11" fill="#555">"Korekta rolowania" w historii rachunku</text>

  <!-- Wiersz 3: netto -->
  <line x1="70" y1="300" x2="520" y2="300" stroke="#ccc" stroke-width="1"/>
  <text x="200" y="313" font-size="11" fill="#333" font-weight="bold">= 0 USD</text>
  <text x="260" y="313" font-size="11" fill="#555">wynik netto bez zmian; SHORT: znaki odwrotnie (-60 / +60)</text>

  <!-- Podpis -->
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#666">Sam moment rolowania jest neutralny. Rośnie tylko wymagany depozyt (wycena po 73,10, nie 72,50).</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666">Koszt contango realizuje się później, przez zjazd ceny 73,10 do spotu.</text>
</svg>
