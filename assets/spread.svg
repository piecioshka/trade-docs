<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Arial, sans-serif" font-size="13">
  <!-- Tło -->
  <rect width="560" height="300" fill="#fafafa" rx="8"/>

  <!-- Tytuł -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Spread: po której cenie kupujesz, a po której sprzedajesz</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">Ropa Brent (OIL) na xStation, kwotowanie BID 70,00 / ASK 70,03</text>

  <!-- Pasmo spreadu -->
  <rect x="120" y="110" width="220" height="60" fill="#fde68a" opacity="0.6"/>
  <text x="240" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">SPREAD = 0,03 USD</text>
  <text x="240" y="152" text-anchor="middle" font-size="10" fill="#b45309">koszt płacony przy otwarciu</text>

  <!-- ASK -->
  <line x1="120" y1="110" x2="340" y2="110" stroke="#dc2626" stroke-width="2.5"/>
  <text x="110" y="114" text-anchor="end" font-size="13" font-weight="bold" fill="#dc2626">ASK 70,03</text>
  <text x="350" y="106" font-size="11" fill="#dc2626" font-weight="bold">tu KUPUJESZ</text>
  <text x="350" y="120" font-size="10" fill="#dc2626">otwierasz LONG / zamykasz SHORT</text>

  <!-- BID -->
  <line x1="120" y1="170" x2="340" y2="170" stroke="#16a34a" stroke-width="2.5"/>
  <text x="110" y="174" text-anchor="end" font-size="13" font-weight="bold" fill="#16a34a">BID 70,00</text>
  <text x="350" y="166" font-size="11" fill="#16a34a" font-weight="bold">tu SPRZEDAJESZ</text>
  <text x="350" y="180" font-size="10" fill="#16a34a">otwierasz SHORT / zamykasz LONG</text>

  <!-- Strzałka: LONG od ASK do BID -->
  <line x1="150" y1="118" x2="150" y2="162" stroke="#666" stroke-width="1"/>
  <path d="M146,156 L150,164 L154,156" fill="none" stroke="#666" stroke-width="1"/>

  <!-- Ścieżka LONG -->
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#333">
    <tspan font-weight="bold">LONG:</tspan> kupujesz po ASK 70,03, a pozycja jest od razu wyceniana po BID 70,00
  </text>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">start: -0,03 USD/baryłkę = -3 USD na 0,1 lota (100 baryłek)</text>

  <!-- Podpis -->
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#666">Żeby wyjść na zero, cena musi ruszyć w Twoją stronę o szerokość spreadu.</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#666">Przy 20 transakcjach dziennie to 0,60 USD/baryłkę samych kosztów.</text>
</svg>
